  - relation_id: transaction-has-type
    subject_ref: PaymentTransaction
    predicate: has_type
    object_ref: TransactionType
  - relation_id: transaction-has-status
    subject_ref: PaymentTransaction
    predicate: has_status
    object_ref: TransactionStatus
  - relation_id: transaction-records-requested-money
    subject_ref: PaymentTransaction
    predicate: records
    object_ref: RequestedMoney
  - relation_id: transaction-records-processed-money
    subject_ref: PaymentTransaction
    predicate: records
    object_ref: ProcessedMoney
  - relation_id: plugin-reports-observation
    subject_ref: PaymentPluginPort
    predicate: reports
    object_ref: ProviderTransactionObservation
  - relation_id: observation-refers-to-transaction
    subject_ref: ProviderTransactionObservation
