    - KB-PARENT-0.146.87
  structures:
    - concept_ref: Payment
      boundary: Identity-bearing orchestration record that references an Account and PaymentMethod and groups transaction history, aggregate amounts, attempts and internal state names
      fields:
        - name: id
          type: PaymentId
          nullable: false
          description: Kill Bill 内 Payment 的稳定身份
          role: identity
        - name: createdAt
          type: Instant
          nullable: true
          description: 记录创建时间；持久化实体必填，构造中或插件观测允许缺失。
          role: stored
        - name: updatedAt
          type: Instant
          nullable: true
          description: 记录最后更新时间，不能代替外部交易发生时间。
          role: stored
        - name: accountRef
          type: AccountRef
          nullable: false
          description: 拥有该 Payment 的 Account；这里只引用，不建模 Account 生命周期
          role: reference
        - name: paymentMethodRef
          type: PaymentMethodId
          nullable: false
          description: 此 Payment 选择的支付方式记录
          role: reference
        - name: paymentNumber
          type: Integer
          nullable: false
          description: Kill Bill 分配的 Payment 序号；不是业务身份，也不能替代 PaymentId
          role: stored
        - name: externalKey
          type: PaymentExternalKey
          nullable: false
          description: 调用方用于关联 Payment 的键；输入缺失时 core 可用 Payment UUID 字符串补齐
          role: stored
        - name: currentState
          type: PaymentStateName
          nullable: true
          description: 当前状态机状态名；初始持久化阶段可以为空
          role: stored
        - name: lastSuccessState
          type: PaymentStateName
          nullable: true
          description: 最近一次成功状态名；与当前状态是两个不同事实
          role: stored
        - name: transactions
          type: PaymentTransaction[1..*]
          nullable: false
          description: 共同构成此 Payment 历史的交易记录；首笔创建完成后至少一条
          role: stored
        - name: attempts
          type: PaymentAttempt[0..*]
          nullable: false
          description: payment-control 的过去或未来尝试，只作为邻接投影保留
          role: adjacent
        - name: currency
          type: Currency
          nullable: true
          description: core 从符合条件的初始交易推导的 Payment 币种；没有可用交易或币种冲突时可为空
          role: derived
        - name: authorizedAmount
          type: Decimal
          nullable: false
          description: 成功且未被 VOID 对应掉的 AUTHORIZE 金额汇总
          role: derived
        - name: capturedAmount
          type: Decimal
          nullable: false
          description: 成功 CAPTURE 的金额汇总；精确实现还会计入邻接的 chargeback 调整
          role: derived
        - name: purchasedAmount
          type: Decimal
          nullable: false
          description: 成功 PURCHASE 的金额汇总；精确实现还会计入邻接的 chargeback 调整
          role: derived
        - name: creditedAmount
          type: Decimal
          nullable: false
          description: 成功 CREDIT 的金额汇总
          role: derived
        - name: refundedAmount
          type: Decimal
          nullable: false
          description: 成功 REFUND 的金额汇总
          role: derived
        - name: authorizationVoided
          type: Boolean
          nullable: false
          description: 是否存在被成功 VOID 对应掉的成功 AUTHORIZE
          role: derived
    - concept_ref: PaymentMethod
      boundary: Kill Bill record that associates one Account with an external key, active flag, plugin name and opaque plugin detail
      fields:
        - name: id
          type: PaymentMethodId
          nullable: false
          description: Kill Bill 内 PaymentMethod 的稳定身份
          role: identity
        - name: createdAt
          type: Instant
          nullable: true
          description: 记录创建时间；持久化实体必填，构造中或插件观测允许缺失。
          role: stored
        - name: updatedAt
          type: Instant
          nullable: true
          description: 记录最后更新时间，不能代替外部交易发生时间。
          role: stored
        - name: accountRef
          type: AccountRef
          nullable: false
          description: 拥有该支付方式的 Account 引用
          role: reference
        - name: externalKey
          type: PaymentMethodExternalKey
          nullable: false
          description: 调用方对 PaymentMethod 的关联键
          role: stored
        - name: active
          type: Boolean
          nullable: false
          description: Kill Bill 是否把该记录视为可用；DDL 默认 true
          role: stored
        - name: pluginName
          type: PluginName
          nullable: false
          description: 用来在运行时解析 PaymentPluginPort 的注册名
          role: stored
        - name: pluginDetail
          type: OpaquePaymentMethodDetail
          nullable: true
          description: Plugin 提供的支付方式细节；只有请求该信息时才可能出现
          role: stored
    - concept_ref: PaymentTransaction
      owner_ref: Payment
      boundary: One independently identified typed payment operation and its requested, processed, status and gateway-result fields
      fields:
        - name: id
          type: PaymentTransactionId
          nullable: false
          description: 这一次交易操作在 Kill Bill 内的稳定身份
          role: identity
        - name: createdAt
          type: Instant
          nullable: true
          description: 记录创建时间；持久化实体必填，构造中或插件观测允许缺失。
          role: stored
        - name: updatedAt
          type: Instant
          nullable: true
          description: 记录最后更新时间，不能代替外部交易发生时间。
          role: stored
        - name: paymentRef
          type: PaymentId
          nullable: false
          description: 该交易所属的 Payment
          role: reference
        - name: attemptRef
          type: PaymentAttemptId
          nullable: true
          description: 触发该交易的 payment-control attempt；直接支付路径允许没有
          role: adjacent
        - name: externalKey
          type: TransactionExternalKey
          nullable: false
          description: 调用方对本次交易的关联/幂等键；输入缺失时可用交易 UUID 字符串补齐
          role: stored
        - name: type
          type: TransactionType
          nullable: false
          description: 本次操作类别；active subset 为六种直接支付操作
          role: stored
        - name: status
          type: TransactionStatus
          nullable: false
          description: Kill Bill 对本次交易结果的记录，不代表外部资金终局
          role: stored
        - name: effectiveAt
          type: Instant
          nullable: false
          description: 本次交易在 Kill Bill 语义中的生效时间
          role: stored
        - name: requestedMoney
          type: RequestedMoney
          nullable: true
          description: 调用方请求的金额和币种；VOID 等无金额操作可以没有
          role: stored
        - name: processedMoney
          type: ProcessedMoney
          nullable: true
          description: Plugin 报告并由 core 投影/保存的处理金额和币种
          role: derived
        - name: gatewayFailure
          type: GatewayFailureDetail
          nullable: true
          description: core 记录的 gateway 错误码和消息
          role: stored
        - name: providerObservation
          type: ProviderTransactionObservation
          nullable: true
          description: 仅在请求 Plugin 详情时附加的边界观测
          role: stored
    - concept_ref: Money
      boundary: 完整金额与币种值对；requested 与 processed 是不同角色。
      fields:
        - name: amount
          type: Decimal
          nullable: false
          description: 精确十进制金额；不使用浮点数计算资金。
          role: representation
        - name: currency
          type: Currency
          nullable: false
          description: 与金额配对的币种；Payment 汇总上的币种是交易历史派生值。
          role: representation
    - concept_ref: GatewayFailureDetail
      boundary: Gateway error code and message recorded on a PaymentTransaction
      fields:
        - name: code
          type: String
          nullable: true
          description: 网关报告的错误码，可缺失。
          role: representation
        - name: message
          type: String
          nullable: true
          description: 网关报告的错误说明，可缺失。
          role: representation
    - concept_ref: ProviderTransactionObservation
      boundary: "PaymentTransactionInfoPlugin data returned by a plugin: Kill Bill IDs, type, processed money, dates, plugin status, gateway errors, provider references and properties"
      fields:
        - name: killBillPaymentRef
          type: PaymentId
          nullable: true
          description: 插件回传的 Kill Bill Payment UUID，需匹配已有记录。
          role: boundary
        - name: killBillTransactionRef
          type: PaymentTransactionId
          nullable: true
          description: 插件回传的 Kill Bill Transaction UUID，需匹配已有记录。
          role: boundary
        - name: transactionType
          type: TransactionType
          nullable: true
          description: 插件报告的交易操作类型。
          role: boundary
        - name: processedMoney
          type: ProcessedMoney
          nullable: true
          description: 插件报告的金额与币种。
          role: boundary
        - name: pluginStatus
          type: PaymentPluginStatus
          nullable: true
          description: 插件原始处理状态，与 Kill Bill 状态分开。
          role: boundary
        - name: createdAt
          type: Instant
          nullable: true
          description: 记录创建时间；持久化实体必填，构造中或插件观测允许缺失。
          role: boundary
        - name: effectiveAt
          type: Instant
          nullable: true
          description: 交易生效时间，由此观测的报告者提供。
          role: boundary
        - name: gatewayFailure
          type: GatewayFailureDetail
          nullable: true
          description: 插件报告的网关错误码和错误消息，可以缺失。
          role: boundary
        - name: firstProviderReference
          type: ProviderReference
          nullable: true
          description: 插件提供的第一条不透明支付引用。
          role: boundary
        - name: secondProviderReference
          type: ProviderReference
          nullable: true
          description: 插件提供的第二条不透明支付引用。
          role: boundary
        - name: properties
          type: PluginProperty[0..*]
          nullable: false
          description: 插件自定义的属性列表，保留原始不透明语义。
          role: boundary
    - concept_ref: JanitorRecovery
      boundary: Core process that re-observes existing payment information through the plugin and may reconcile incomplete Kill Bill state
      fields:
        - name: targetPayment
          type: PaymentId
          nullable: false
          description: 本次重新查询对应的已有 Payment 身份。
          role: representation
        - name: targetTransactions
          type: PaymentTransactionId[1..*] where status in {PENDING, UNKNOWN}
          nullable: false
          description: 需要重新查询处理状态的已有交易身份集合。
          role: representation
        - name: observationPort
          type: PaymentPluginPort.getPaymentInfo
          nullable: false
          description: 用于重新查询已有操作的端口方法，不再次提交支付命令。
          role: representation
        - name: outcome
          type: RecoveryOutcome
          nullable: false
          description: core 状态修正或继续保留不确定性。
          role: representation
  states:
