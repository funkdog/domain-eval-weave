schema_version: domain-first-internal-v0
module_id: payments.orchestration.killbill
release:
  version: 0.1.0-candidate.4
  recorded_at: 2026-09-06T16:38:23.870Z
maintainers:
  - maintainer_id: cat-vjdun65e
scope:
  statement: Kill Bill 0.24.21 直接支付编排与已有不完整交易恢复；候选知识包。
  includes:
    - payment-method-routing
    - transaction-identity
    - AUTHORIZE
    - CAPTURE
    - PURCHASE
    - CREDIT
    - REFUND
    - VOID
    - plugin-outcomes
    - pending-completion
    - janitor
    - external-keys
    - money-propagation
  excludes:
    - provider-financial-rules
    - CHARGEBACK
    - PAYMENT_SYSTEM_OFF
    - settlement
    - reconciliation
    - china-regulation
    - payment-control-retry
concepts:
  - concept_id: AccountRef
    kind: external-reference
    definition: Reference to the Kill Bill account that owns payment methods and payments; the Account lifecycle is not modeled here
  - concept_id: PaymentMethod
    kind: entity
    definition: Kill Bill record that associates one Account with an external key, active flag, plugin name and opaque plugin detail
  - concept_id: Payment
    kind: aggregate-candidate
    definition: Identity-bearing orchestration record that references an Account and PaymentMethod and groups transaction history, aggregate amounts, attempts and internal state names
  - concept_id: PaymentTransaction
    kind: entity-within-Payment
    definition: One independently identified typed payment operation and its requested, processed, status and gateway-result fields
  - concept_id: PaymentExternalKey
    kind: correlation-value
    definition: Caller-provided Payment correlation key; if absent, core persistence may default it to the Payment UUID string
  - concept_id: TransactionExternalKey
    kind: correlation-idempotency-value
    definition: Caller-provided transaction key whose collision behavior depends on existing outcome and operation
  - concept_id: PaymentMethodExternalKey
    kind: correlation-value
    definition: External reference stored on a PaymentMethod
  - concept_id: TransactionType
    kind: enum
    definition: Exact API vocabulary AUTHORIZE, CAPTURE, CHARGEBACK, CREDIT, PURCHASE, REFUND, VOID
  - concept_id: ActiveDirectTransactionType
    kind: scoped-enum-view
    definition: Accepted subset AUTHORIZE, CAPTURE, CREDIT, PURCHASE, REFUND, VOID; CHARGEBACK remains visible but adjacent with reversal
  - concept_id: TransactionStatus
    kind: enum
    definition: Exact API vocabulary SUCCESS, UNKNOWN, PENDING, PAYMENT_FAILURE, PLUGIN_FAILURE, PAYMENT_SYSTEM_OFF
  - concept_id: ActiveTransactionStatus
    kind: scoped-enum-view
    definition: Accepted result surface SUCCESS, UNKNOWN, PENDING, PAYMENT_FAILURE, PLUGIN_FAILURE; PAYMENT_SYSTEM_OFF remains adjacent
  - concept_id: PaymentStateName
    kind: internal-state-value
    definition: Current and last-success state names persisted by Kill Bill and derived from the configured operation state machines
  - concept_id: PaymentPluginStatus
    kind: boundary-enum
    definition: Plugin-side result vocabulary PROCESSED, PENDING, ERROR, UNDEFINED, CANCELED
  - concept_id: RequestedMoney
    kind: value-object
    definition: Amount and currency requested by the merchant-facing Kill Bill operation
  - concept_id: ProcessedMoney
    kind: optional-value-object
    definition: Amount and currency reported by the plugin and persisted as processed values
  - concept_id: GatewayFailureDetail
    kind: optional-value-object
    definition: Gateway error code and message recorded on a PaymentTransaction
  - concept_id: PluginName
    kind: service-key-value
    definition: Registration name stored by PaymentMethod and used to resolve a PaymentPlugin service at runtime
  - concept_id: PaymentPluginPort
    kind: external-port
    definition: Versioned PaymentPluginApi operations used by Kill Bill to add payment methods, execute payment operations and retrieve later payment information
  - concept_id: ProviderTransactionObservation
    kind: boundary-observation
    definition: "PaymentTransactionInfoPlugin data returned by a plugin: Kill Bill IDs, type, processed money, dates, plugin status, gateway errors, provider references and properties"
  - concept_id: ProviderReference
    kind: opaque-boundary-value
    definition: First or second provider reference string reported through the plugin result
  - concept_id: OpaquePaymentMethodDetail
    kind: opaque-boundary-value
    definition: Plugin-owned payment-method detail attached to the Kill Bill PaymentMethod API projection
  - concept_id: JanitorRecovery
    kind: recovery-process-candidate
    definition: Core process that re-observes existing payment information through the plugin and may reconcile incomplete Kill Bill state
  - concept_id: Money
    kind: value-object
    definition: 完整金额与币种值对；requested 与 processed 是不同角色。
  - concept_id: PaymentAttempt
    kind: adjacent-reference
    definition: Payment API 展示的 payment-control 尝试，生命周期属于邻接域。
relations:
  - relation_id: account-owns-payment-method
    subject_ref: AccountRef
    predicate: owns
    object_ref: PaymentMethod
  - relation_id: account-owns-payment
    subject_ref: AccountRef
    predicate: owns
    object_ref: Payment
  - relation_id: payment-uses-method
    subject_ref: Payment
    predicate: uses
    object_ref: PaymentMethod
  - relation_id: payment-contains-transaction
    subject_ref: Payment
    predicate: contains
    object_ref: PaymentTransaction
  - relation_id: transaction-belongs-to-payment
    subject_ref: PaymentTransaction
    predicate: belongs_to
    object_ref: Payment
  - relation_id: method-routes-via-name
    subject_ref: PaymentMethod
    predicate: routes_via
    object_ref: PluginName
  - relation_id: name-resolves-plugin
    subject_ref: PluginName
    predicate: resolves_at_runtime_to
