      trigger: NEXT_OPERATION
      description: 按最近成功状态选择下一操作；仍需通过账户、key、币种和未决交易校验。
    - transition_id: link-PURCHASE_SUCCESS-REFUND_INIT
      from: PURCHASE_SUCCESS
      to: REFUND_INIT
      trigger: NEXT_OPERATION
      description: 按最近成功状态选择下一操作；仍需通过账户、key、币种和未决交易校验。
    - transition_id: link-REFUND_SUCCESS-REFUND_INIT
      from: REFUND_SUCCESS
      to: REFUND_INIT
      trigger: NEXT_OPERATION
      description: 按最近成功状态选择下一操作；仍需通过账户、key、币种和未决交易校验。
  flows:
    - flow_id: direct-operation
      description: 新直接操作的记录、执行和结果处理
      concept_refs:
        - Payment
        - PaymentTransaction
        - PaymentMethod
        - PaymentPluginPort
      steps:
        - step_id: step-1
          description: 解析已有 Payment 身份。
        - step_id: step-2
          description: 校验所属 Account。
        - step_id: step-3
          description: 按开关先调用 Janitor 重新观测。
        - step_id: step-4
          description: 校验 external key、类型与完成候选。
        - step_id: step-5
          description: 从最近成功状态选择操作与配置。
        - step_id: step-6
          description: 币种和状态转换检查通过后创建 UNKNOWN 交易。
        - step_id: step-7
          description: 按 PaymentMethod 的 pluginName 解析并调用插件。
        - step_id: step-8
          description: 映射结果并保存交易和 Payment 状态。
        - step_id: step-9
          description: 发布内部事件并返回 Payment 投影。
    - flow_id: authorize-capture-void
      description: 授权后扣款或撤销
      concept_refs:
        - Payment
        - PaymentTransaction
      steps:
        - step_id: step-1
          description: AUTHORIZE 成功后可 CAPTURE 或 VOID。
        - step_id: step-2
          description: CAPTURE 成功后可再次 CAPTURE 或 REFUND。
        - step_id: step-3
          description: 默认配置 CAPTURE 成功后不再允许 VOID。
    - flow_id: purchase-refund
      description: 购买或扣款后的退款
      concept_refs:
        - Payment
        - PaymentTransaction
      steps:
        - step_id: step-1
          description: PURCHASE 可发起新 Payment。
        - step_id: step-2
          description: PURCHASE 或 CAPTURE 成功后可提交 REFUND。
        - step_id: step-3
          description: REFUND 成功后可继续 REFUND；金额上限由 Provider/产品规则另行规定。
    - flow_id: credit
      description: 独立 CREDIT 操作
      concept_refs:
        - Payment
        - PaymentTransaction
      steps:
        - step_id: step-1
          description: CREDIT 可以发起 Payment。
        - step_id: step-2
          description: 默认 CREDIT_SUCCESS 没有活动后继操作；不得解释成账本 credit 或退款。
    - flow_id: pending-completion
      description: 可信调用方显式完成 PENDING
      concept_refs:
        - PaymentTransaction
      steps:
        - step_id: step-1
          description: 核验目标交易为 PENDING、身份和类型匹配。
        - step_id: step-2
          description: 复用原交易，显式结果路径不再次调用操作插件。
        - step_id: step-3
          description: 更新为 SUCCESS 或 PAYMENT_FAILURE；结果依据由调用方负责。
        - step_id: step-4
          description: 仅显式完成入口绕过操作插件；普通 PURCHASE 复用同 key 的 PENDING 交易时仍可能调用 purchasePayment。
    - flow_id: janitor-recovery
      description: 重新查询已有操作
      concept_refs:
        - JanitorRecovery
        - PaymentPluginPort
        - PaymentTransaction
      steps:
        - step_id: step-1
          description: 定时、读取或新操作触发已有交易查询。
        - step_id: step-2
          description: 调用 getPaymentInfo 并按交易身份匹配。
        - step_id: step-3
          description: 可以修正状态，未获得足够信息时保留不确定性。
        - step_id: step-4
          description: core 不重新提交支付操作；不等同新业务重试。
        - step_id: step-5
          description: 匹配状态再次为 PENDING 时不写交易更新；无法取得更明确状态时保留已有状态。
        - step_id: step-6
          description: 恢复时 Plugin 缺失的金额/币种使用已有 processed money 默认值；不得假定回填原请求金额。
        - step_id: step-7
          description: getPaymentInfo 是 core 端口名，不保证适配器纯读取；Stripe Plugin 8.0.4 的 confirm/cancel、Search 空结果推断和幂等关联条件见行为文档 E2，不能由 core Claim 替代验证。
  invariants:
    - rule_id: definition-1
      description: "`Payment`, `PaymentMethod` and `PaymentTransaction` retain distinct UUID identities."
    - rule_id: definition-2
      description: Every active PaymentTransaction refers to exactly one Payment; equal external keys do not merge    transactions.
    - rule_id: definition-3
      description: Payment-, transaction- and payment-method external keys remain role-qualified values even when a    missing key defaults to an entity UUID string.
    - rule_id: definition-4
      description: "`TransactionType`, `TransactionStatus`, `PaymentStateName` and `PaymentPluginStatus` remain different    semantic axes."
    - rule_id: definition-5
      description: RequestedMoney and ProcessedMoney remain distinguishable; equal values do not make the roles identical.
    - rule_id: definition-6
      description: A ProviderTransactionObservation is boundary data reported through a plugin, not an independently    authoritative provider or financial record.
    - rule_id: definition-7
      description: ProviderReference values do not establish cross-system identity without a Mapping and observation    contract.
    - rule_id: definition-8
      description: "`PENDING` and `UNKNOWN` remain distinct incomplete orchestration statuses; neither may be collapsed into    success or known failure."
    - rule_id: definition-9
      description: JanitorRecovery updates knowledge/state about an existing orchestration record; it is not by definition    a new external economic attempt.
    - rule_id: definition-10
      description: Kill Bill orchestration success remains distinct from provider authorization, clearing, settlement,     payout, bank receipt and accounting closure.
    - rule_id: definition-11
      description: Adjacent enum values and API types remain visible even when excluded from the active scoped model.
