name: verify

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          package-manager-cache: false
      - name: Enable pnpm
        run: corepack enable
      - name: Initialize isolated legacy runtime
        run: |
          sudo install -d -m 755 /Users/slipshod/AIBuild
          sudo install -d -m 700 /Users/slipshod/AIBuild/dsh-eval-lab-runtime
          sudo install -d -m 700 /Users/slipshod/AIBuild/dsh-eval-lab-runtime/dsh-home
          sudo chown -R "$USER" /Users/slipshod/AIBuild/dsh-eval-lab-runtime
      - name: Install Linux sandbox
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bubblewrap
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Static checks
        run: pnpm check && pnpm lint
      - name: Tests
        run: pnpm test
      - name: Build package closures
        run: pnpm build
      - name: Report open-source readiness
        run: pnpm readiness:open-source
